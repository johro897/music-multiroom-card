<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="800" fill="#111111"/>
  <g font-family="Roboto, sans-serif" fill="#e6e6e6">
    <!-- groups strip -->
    <rect x="28" y="28" width="220" height="40" rx="20" fill="#1c1c1c" stroke="#03a9f4" stroke-width="1.5"/>
    <circle cx="46" cy="48" r="5" fill="#03a9f4"/>
    <text x="60" y="53" font-size="14" font-weight="600">Living Room + Kitchen</text>
    <rect x="260" y="28" width="140" height="40" rx="20" fill="#1c1c1c" stroke="#333333" stroke-width="1.5"/>
    <circle cx="278" cy="48" r="5" fill="#ab47bc"/>
    <text x="292" y="53" font-size="14" font-weight="600">Bedroom</text>
    <rect x="412" y="28" width="130" height="40" rx="20" fill="#1c1c1c" stroke="#555555" stroke-dasharray="4 3" stroke-width="1.5"/>
    <text x="432" y="53" font-size="14" font-weight="600" fill="#9b9b9b">+ New Group</text>

    <!-- hero -->
    <rect x="28" y="88" width="1224" height="88" rx="14" fill="#1c1c1c"/>
    <rect x="28" y="88" width="4" height="88" fill="#03a9f4"/>
    <rect x="52" y="104" width="56" height="56" rx="10" fill="#202020"/>
    <text x="126" y="118" font-size="11" letter-spacing="1" fill="#9b9b9b">NOW PLAYING</text>
    <text x="126" y="140" font-size="19" font-weight="600">Chill Mix</text>
    <text x="126" y="160" font-size="13" fill="#9b9b9b">Spotify Playlist</text>

    <!-- rooms label -->
    <text x="28" y="204" font-size="12" letter-spacing="1" fill="#9b9b9b">ROOMS</text>

    <!-- room grid: 3x2 -->
    <g>
      <rect x="28" y="220" width="392" height="90" rx="14" fill="#123a52" stroke="#03a9f4" stroke-width="1.5"/>
      <rect x="430" y="220" width="392" height="90" rx="14" fill="#123a52" stroke="#03a9f4" stroke-width="1.5"/>
      <rect x="832" y="220" width="392" height="90" rx="14" fill="#1c1c1c" stroke="#3a2340" stroke-width="1.5" opacity="0.6"/>
      <rect x="28" y="326" width="392" height="90" rx="14" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1.5"/>
      <rect x="430" y="326" width="392" height="90" rx="14" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1.5"/>
      <rect x="832" y="326" width="392" height="90" rx="14" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1.5"/>
    </g>
    <text x="52" y="256" font-size="14" font-weight="500">Living Room</text>
    <text x="454" y="256" font-size="14" font-weight="500">Kitchen</text>
    <text x="856" y="256" font-size="14" font-weight="500" opacity="0.7">Bedroom</text>
    <text x="52" y="362" font-size="14" font-weight="500">Office</text>
    <text x="454" y="362" font-size="14" font-weight="500">Patio</text>
    <text x="856" y="362" font-size="14" font-weight="500">Bathroom</text>

    <!-- group volume -->
    <rect x="28" y="436" width="1224" height="52" rx="14" fill="#1c1c1c"/>
    <text x="52" y="468" font-size="13" font-weight="600">Group Volume</text>
    <rect x="220" y="458" width="900" height="4" rx="2" fill="#333333"/>
    <rect x="220" y="458" width="560" height="4" rx="2" fill="#03a9f4"/>

    <!-- favorites shelf -->
    <rect x="28" y="700" width="180" height="40" rx="10" fill="#1c1c1c"/>
    <rect x="32" y="704" width="86" height="32" rx="8" fill="#03a9f4"/>
    <text x="52" y="725" font-size="13" font-weight="600" fill="#0b1a20">Spotify</text>
    <text x="140" y="725" font-size="13" font-weight="600" fill="#9b9b9b">Radio</text>
    <g>
      <rect x="28" y="752" width="190" height="34" rx="10" fill="#1c1c1c"/>
      <rect x="230" y="752" width="190" height="34" rx="10" fill="#1c1c1c"/>
      <rect x="432" y="752" width="190" height="34" rx="10" fill="#1c1c1c"/>
      <rect x="634" y="752" width="190" height="34" rx="10" fill="#1c1c1c"/>
      <rect x="836" y="752" width="190" height="34" rx="10" fill="#1c1c1c"/>
      <rect x="1038" y="752" width="214" height="34" rx="10" fill="#1c1c1c"/>
    </g>
  </g>
</svg>
